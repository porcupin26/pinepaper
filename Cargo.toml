[package]
name = "pinepaper"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "A native notebook and reader for PineNote and Linux Wayland desktops"
license = "MIT"
repository = "https://github.com/porcupin26/pinepaper"

[dependencies]
anyhow = "1"
wayland-client = "=0.31.14"
wayland-protocols = { version = "=0.32.13", features = ["client"] }
memmap2 = "=0.9.11"
rustix = { version = "=1.1.5", features = ["fs", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
html2text = "0.17"
flate2 = "1"
tempfile = "3"
xkbcommon-dl = "0.4"
zbus = "5"
tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
